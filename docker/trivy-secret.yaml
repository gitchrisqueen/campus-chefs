# Trivy secret-scan config for the CI image scan (.github/workflows/ci.yml).
# The Anthropic SDK's beta type and resource modules quote the literal
# {"type": "service_account"} in docstrings, which Trivy's gcp-service-account rule
# reports as a CRITICAL key. It is documentation in a pinned third-party package.
# The allow rule covers only those two SDK directories; everything else is still scanned.
allow-rules:
  - id: anthropic-sdk-docstring
    description: "Anthropic SDK docstrings quote a service_account type literal; documentation, not a key."
    path: '^opt/venv/lib/python3\.14/site-packages/anthropic/(types|resources)/beta/'
