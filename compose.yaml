# One-command demo: `docker compose up` (or `make demo`), then open http://127.0.0.1:8000
# Secrets are generated by `keygen` on first run; nothing secret is committed.
# Parallel stacks (other worktrees): set COMPOSE_PROJECT_NAME, WEB_PORT and CC_IMAGE so they never share images.
name: campuschefs

x-app-env: &app-env
  CC_DEMO_MODE: ${CC_DEMO_MODE:-true}
  CC_DEMO_LOCAL_HTTP: "true"
  CC_REGISTRATION_OPEN: ${CC_REGISTRATION_OPEN:-true}
  CC_AI_ENABLED: ${CC_AI_ENABLED:-false}
  CC_AI_MODEL: ${CC_AI_MODEL:-}
  CC_FEEDBACK_URL: ${CC_FEEDBACK_URL:-}
  DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,web"
  DJANGO_SECRET_KEY_FILE: /run/cc-secrets/django_secret_key
  DB_HOST: db
  DB_NAME: campuschefs

x-hardened: &hardened
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]

services:
  keygen:
    image: alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    command: ["/bin/sh", "/keygen.sh"]
    network_mode: none
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - secrets-db:/out/db
      - secrets-owner:/out/owner
      - secrets-web:/out/web
      - pgdata:/pgdata:ro
      - ./docker/keygen.sh:/keygen.sh:ro
    restart: "no"

  db:
    image: postgres:18.7-alpine3.24@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    depends_on:
      keygen: { condition: service_completed_successfully }
    environment:
      POSTGRES_DB: campuschefs
      POSTGRES_PASSWORD_FILE: /run/cc-secrets/db_superuser_password
    volumes:
      # PG18 image: VOLUME /var/lib/postgresql, PGDATA=/var/lib/postgresql/18/docker
      - pgdata:/var/lib/postgresql
      - secrets-db:/run/cc-secrets:ro
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 200
    healthcheck:
      # -h forces TCP, so the temporary init-phase server (socket only) does not pass.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d campuschefs"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  migrate:
    <<: *hardened
    build: { context: ., target: runtime }
    image: ${CC_IMAGE:-campuschefs}:local
    command: ["python", "manage.py", "bootstrap_demo"]
    environment:
      <<: *app-env
      DB_USER: campuschefs_owner
      DB_PASSWORD_FILE: /run/cc-secrets/db_owner_password
    volumes: ["secrets-owner:/run/cc-secrets:ro"]
    networks: [backend]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  web:
    <<: *hardened
    image: ${CC_IMAGE:-campuschefs}:local
    environment:
      <<: *app-env
      DB_USER: campuschefs_app
      DB_PASSWORD_FILE: /run/cc-secrets/db_app_password
    volumes: ["secrets-web:/run/cc-secrets:ro"]
    networks: [backend, frontend]
    ports: ["127.0.0.1:${WEB_PORT:-8000}:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    mem_limit: 512m
    pids_limit: 256
    stop_grace_period: 25s
    restart: unless-stopped

  tests:
    profiles: ["test"]
    build: { context: ., target: dev }
    image: ${CC_IMAGE:-campuschefs}:dev
    environment:
      <<: *app-env
      DB_USER: campuschefs_owner
      DB_PASSWORD_FILE: /run/cc-secrets/db_owner_password
      DB_APP_USER: campuschefs_app
      DB_APP_PASSWORD_FILE: /run/cc-secrets-app/db_app_password
      CC_REQUIRE_ROLE_TESTS: "1"
      BASE_URL: "http://web:8000"
    volumes:
      - ".:/src:ro"
      - "./test-results:/src/test-results"
      - "./docs/screenshots:/src/docs/screenshots"
      - "secrets-owner:/run/cc-secrets:ro"
      - "secrets-web:/run/cc-secrets-app:ro"
    networks: [backend]
    depends_on:
      db: { condition: service_healthy }
    command: ["pytest"]

networks:
  backend: { internal: true }
  frontend: {}

volumes:
  pgdata: {}
  secrets-db: {}
  secrets-owner: {}
  secrets-web: {}
