{% if q %}
  {% if results %}
    <p class="small muted">{{ results|length }} dish{{ results|length|pluralize:"es" }} match “{{ q }}”.</p>
    <ul class="results">
      {% for dish in results %}<li>{{ dish }}</li>{% endfor %}
    </ul>
  {% else %}
    <p class="empty">No dishes match “{{ q }}”.</p>
  {% endif %}
{% endif %}
