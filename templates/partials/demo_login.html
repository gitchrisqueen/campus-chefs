{% if demo_mode %}
  <section class="demo-login{% if home %} home-demo{% endif %}"
           aria-labelledby="demo-login-heading">
    <div>
      <h2 id="demo-login-heading">Try it in one click</h2>
      <p>Step in as a made-up student. No sign-up, no password.</p>
    </div>
    <div class="demo-actions">
      <form class="inline-form" method="post" action="{% url 'demo_login' 'diner' %}">
        {% csrf_token %}
        <button type="submit" class="btn {% if home %}btn-primary{% else %}btn-secondary{% endif %}">Try as demo diner</button>
      </form>
      <form class="inline-form" method="post" action="{% url 'demo_login' 'cook' %}">
        {% csrf_token %}
        <button type="submit" class="link-button">Try as demo cook</button>
      </form>
    </div>
  </section>
{% endif %}
