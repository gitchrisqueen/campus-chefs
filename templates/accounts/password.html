{% extends "base.html" %}
{% block title %}Change password · Campus Chefs{% endblock title %}
{% block content %}
  <section class="card">
    <h1>Change password</h1>
    <p>Changing your password logs you out everywhere else.</p>
    <form method="post" action="{% url 'password_change' %}" novalidate>
      {% csrf_token %}
      {% include "partials/form_fields.html" %}
      <button type="submit">Change password</button>
    </form>
    <p>
      <a href="{% url 'me' %}">Back to my account</a>
    </p>
  </section>
{% endblock content %}
