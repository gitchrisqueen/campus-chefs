{% extends "base.html" %}
{% block title %}Change password · Campus Chefs{% endblock title %}
{% block content %}
  <section class="card auth" aria-labelledby="password-heading">
    <header class="auth-head">
      <span class="eyebrow">My account</span>
      <h1 id="password-heading">Change password</h1>
      <p>Changing your password logs you out everywhere else.</p>
    </header>
    <form class="form" method="post" action="{% url 'password_change' %}" novalidate>
      {% csrf_token %}
      {% include "partials/form_fields.html" %}
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Change password</button>
        <a href="{% url 'me' %}">Back to my account</a>
      </div>
    </form>
  </section>
{% endblock content %}
